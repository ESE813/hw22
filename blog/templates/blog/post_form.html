{% extends 'catalog/base.html' %}

{% block title %}
Форма блоговой записи
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">
        {% if object %}
            Редактирование записи
        {% else %}
            Создание записи
        {% endif %}
    </h2>

    <form method="post"
          enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-success">
            Сохранить
        </button>

        <a href="{% url 'blog:post_list' %}"
           class="btn btn-secondary">
            Отмена
        </a>

    </form>

</div>

{% endblock %}
